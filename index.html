<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>APK MOBILADOR</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    color: white;
    overflow-x: hidden;
}

/* BACKGROUND */
.bg {
    position: fixed;
    width: 100%;
    height: 100%;
    background: url('https://i.postimg.cc/Sx1WVQSZ/9d69702fb3071f9f7125831d53d60794.jpg') center center no-repeat;
    background-size: cover;
    z-index: -2;
    filter: brightness(1.2) contrast(1.2) saturate(1.2);
}

/* OVERLAY */
.overlay {
    position: fixed;
    width: 100%;
    height: 100%;
    background: rgba(2,6,23,0.45);
    z-index: -1;
}

/* CONTAINER */
.container {
    padding: 20px;
}

/* TITLE */
h1 {
    text-align: center;
    margin-bottom: 20px;
}

/* CARD */
.card {
    background: rgba(15, 23, 42, 0.55);
    backdrop-filter: blur(8px);
    border-radius: 12px;
    padding: 15px;
    margin-bottom: 12px;
    cursor: pointer;
    transition: 0.3s;
    border-left: 4px solid transparent;
}

/* ACTIVE */
.card.active {
    border-left: 4px solid #22d3ee;
    background: rgba(15, 23, 42, 0.7);
}

/* WATERMARK */
.watermark {
    position: fixed;
    bottom: 12px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 13px;
    color: rgba(255,255,255,0.65);
    letter-spacing: 1px;
    z-index: 10;
    pointer-events: none;
    text-shadow: 0 0 10px rgba(34,211,238,0.7);
}
</style>
</head>

<body>

<div class="bg"></div>
<div class="overlay"></div>

<div class="container">
    <h1>APK MOBILADOR</h1>

    <div class="card" onclick="openLink(this, 'https://www.mediafire.com/file/1t8bgx1b4e4b8co/gg-mouse-pro-premium.apk/file')">
        GG MOUSE PREMIUM
    </div>

    <div class="card" onclick="openLink(this, 'https://www.mediafire.com/file/7deqecyve177lkb/MSI-mobi.apk/file')">
        MSI V3
    </div>

    <div class="card" onclick="openLink(this, 'https://www.mediafire.com/file/w407ix48koxcu82/bluestack-mobi.apk/file')">
        BLUESTACK 9.3
    </div>

</div>

<div class="watermark">By RapsX13 ⚡</div>

<script>
function openLink(el, link) {
    document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
    el.classList.add('active');
    window.open(link, '_blank');
}
</script>

</body>
</html>
